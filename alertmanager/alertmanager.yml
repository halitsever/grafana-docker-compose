global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'alertmanager@example.com'
  # smtp_auth_password: 'your-password'

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'

  routes:
    - matchers:
        - severity="critical"
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  - name: 'default'
    # email_configs:
    #   - to: 'your-email@example.com'
    #     send_resolved: true

    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#alerts'
    #     send_resolved: true

  - name: 'critical'
    # email_configs:
    #   - to: 'oncall@example.com'
    #     send_resolved: true

inhibit_rules:
  # Warning and critical pairs have different alert names and share a resource label.
  - source_matchers:
      - severity="critical"
      - resource=~".+"
    target_matchers:
      - severity="warning"
    equal: ['instance', 'resource', 'mountpoint']
