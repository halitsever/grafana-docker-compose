version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      docker-compose-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-compose-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      docs-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docs-major:
        patterns: ["*"]
        update-types: [major]
